name: Tuwaga EO role checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test
      BETTER_AUTH_SECRET: test-secret-for-ci-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: pnpm build
